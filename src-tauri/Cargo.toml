[package]
name = "mimic-linux"
version = "0.2.0"
description = "Local Discord activity utility for Linux"
authors = ["Mimic Linux contributors", "Timon2306 (upstream)"]
license = "MIT"
edition = "2021"

[lib]
name = "mimic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
tokio = { version = "1", features = ["full"] }

tempfile = "3"
libc = "0.2"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
