name: Linux checks and build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf
      - run: npm ci --ignore-scripts
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: npm run check
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: npm run linux:build -- --ci
      - uses: actions/upload-artifact@v4
        with:
          name: mimic-linux-x86_64
          path: |
            src-tauri/target/release/mimic-linux
            src-tauri/target/release/bundle/deb/*.deb
